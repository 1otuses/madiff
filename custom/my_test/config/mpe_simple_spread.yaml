# MPE Simple Spread 环境配置
# ============================================================
# 用于 custom/my_test 的 Risk-Guided CFG Diffusion 实验
#
# 使用方法:
#   python custom/my_test/run_experiment.py -c custom/my_test/config/mpe_simple_spread.yaml

meta_data:
  exp_name: "my_test_mpe_spread"
  script_path: "custom/my_test/run_scripts/train.py"
  eval_script_path: "custom/my_test/run_scripts/evaluate.py"
  num_workers: 1
  gpu: 0

# ------------------------------------------------------------
# 环境 & 数据
# ------------------------------------------------------------
env:
  env_type: "mpe"
  env_name: "simple_spread"
  quality: "expert"               # expert / medium / medium-replay / random
  n_agents: 3
  obs_dim: 18
  action_dim: 2                   # MPE 连续动作维度 (dx, dy)
  n_actions: 2                    # 逆动力学输出维度 (连续动作)
  max_path_length: 25             # MPE spread 的典型 episode 长度

# ------------------------------------------------------------
# 扩散模型
# ------------------------------------------------------------
model:
  horizon: 10                     # 预测时间长度
  history_horizon: 2              # 条件观测历史长度
  n_timesteps: 100                # DDPM 扩散步数
  hidden_dim: 256
  n_blocks: 4
  use_returns_condition: true
  use_risk_guide: true
  condition_guidance_w: 1.2
  risk_guidance_w: 0.5
  risk_type: "cvar"               # var / cvar / wang
  risk_alpha: 0.1
  share_inv: true                 # 逆动力学模型参数共享

# ------------------------------------------------------------
# 训练参数 (step-based)
# ------------------------------------------------------------
training:
  n_train_steps: 100000          # 总训练步数 (1M)
  batch_size: 128
  learning_rate: 0.0002
  gradient_accumulate_every: 2
  ema_decay: 0.995
  log_freq: 100                  # 每 N 步记录一次日志 (短训练会自动适应)
  save_freq: 50000                # 每 N 步保存一次 checkpoint
  sample_freq: 10000              # 每 N 步采样渲染一次
  seed: 42

# ------------------------------------------------------------
# 评估参数
# ------------------------------------------------------------
evaluation:
  eval_freq: 100000               # 每 N 步评估一次
  n_eval_episodes: 10             # 每次评估运行的 episode 数
  n_eval_seeds: 3                 # 评估使用的随机种子数
  save_video: true                # 是否生成视频
  video_dir: "videos"             # 视频保存子目录
  target_return: 20.0             # 评估时的 CFG 目标回报
  ddim_steps: null                # DDIM 加速步数 (null=完整DDPM, 如 10)
  ddim_eta: 0.0                   # DDIM 随机因子 (0=确定, 1=去噪强度)

# ------------------------------------------------------------
# 路径 & 日志
# ------------------------------------------------------------
paths:
  data_dir: "diffuser/datasets/data/mpe/{env_name}/{quality}"
  save_dir: "runs/my_test/{env_name}"
  checkpoint_dir: "runs/my_test/{env_name}/checkpoint"
  tb_dir: "runs/my_test/{env_name}/tensorboard"
