meta_data:
  exp_name: "eval_mpe_spread_plan_compatibility"
  script_path: "run_scripts/evaluate.py"
  num_workers: 1

variables:
  log_dir: [
    # "logs/mad_mpe/simple_spread-expert/h_24-models.SharedConvAttentionDeconv-r_700-guidew_1.2-ctde_False/100",
    # "logs/mad_mpe/simple_spread-expert/h_24-models.SharedConvAttentionDeconv-r_700-guidew_1.2-ctde_True/200",
    "logs/mad_mpe/simple_spread-expert/h_24-models.SharedIndependentTemporalUnet-r_700-guidew_1.2-ctde_True/200",
    
  ]

constants:
