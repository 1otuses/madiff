meta_data:
  exp_name: ci_codiff_p2_omar_spread_h5_seed0
  script_path: run_scripts/train_mode_consistent.py
  num_workers: 1
  job_name: "{stage}/{dataset_name}/{model_kind}/k_{n_modes}-h_{window_horizon}-s_{window_stride}-steps_{n_train_steps}"

variables:
  model_kind: [vq, no_code]

constants:
  stage: central
  dataset_name: omar_spread_expert
  dataset_path: /home/lotus/lotus/lhh/offline_datasets/CI-CoDiff/omar/simple_spread/expert_unlabeled_h25.npz
  seed: 0

  # 每个 collector 内分别划分，collector ID 不进入模型。
  split_strategy: collector_stratified
  split_seed: 20260815
  validation_fraction: 0.15
  test_fraction: 0.15

  n_modes: 6
  hidden_dim: 128
  latent_dim: 32
  agent_embedding_dim: 8
  commitment_cost: 0.25
  window_horizon: 5
  window_stride: 1

  # 全部数据约 420 万窗口，70% train 约 294 万；33000 updates 约为 1.44 个 train pass。
  n_train_steps: 33000
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 0.0003
  log_freq: 250
  save_freq: 2000
  continue_training: false
