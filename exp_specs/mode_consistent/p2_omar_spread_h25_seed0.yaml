meta_data:
  exp_name: ci_codiff_p2_omar_spread_h25_seed0
  script_path: run_scripts/train_mode_consistent.py
  num_workers: 1
  job_name: "{stage}/{dataset_name}/{model_kind}/k_{n_modes}-h_{window_horizon}-steps_{n_train_steps}"

variables:
  model_kind: [vq, no_code]

constants:
  stage: central
  dataset_name: omar_spread_expert_h25
  dataset_path: /home/lotus/lotus/lhh/offline_datasets/CI-CoDiff/omar/simple_spread/expert_unlabeled_h25.npz
  seed: 0

  # collector ID 只用于分层划分，不输入模型。
  split_strategy: collector_stratified
  split_seed: 20260815
  validation_fraction: 0.15
  test_fraction: 0.15

  n_modes: 6
  hidden_dim: 128
  latent_dim: 32
  agent_embedding_dim: 8
  vq_beta: 0.001
  vq_loss_design: vomasd
  trajectory_scope: full_episode
  window_horizon: 25
  window_stride: 1

  # 140000 个 train episode；1600 x 128 约等于 1.46 个 train pass。
  n_train_steps: 1600
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 0.0003
  log_freq: 25
  save_freq: 200
  continue_training: false
