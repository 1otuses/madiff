meta_data:
  exp_name: ci_codiff_p2_smoke
  script_path: run_scripts/train_mode_consistent.py
  num_workers: 1
  job_name: "{stage}/{dataset_name}/k_{n_modes}-h_{window_horizon}-s_{window_stride}"

variables:
  seed: [0]

constants:
  stage: central
  dataset_name: paired_spread_smoke
  dataset_path: /tmp/ci_codiff_mpe_smoke.npz

  # 该配置只验证入口，不用于判断 P2 有效性。
  split_seed: 20260814
  validation_fraction: 0.15
  test_fraction: 0.15

  n_modes: 2
  hidden_dim: 16
  latent_dim: 4
  agent_embedding_dim: 4
  commitment_cost: 0.25
  window_horizon: 2
  window_stride: 1

  n_train_steps: 2
  batch_size: 2
  eval_batch_size: 8
  learning_rate: 0.0003
  log_freq: 1
  save_freq: 2
  continue_training: false
