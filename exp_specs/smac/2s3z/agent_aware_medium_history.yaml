# 功能: 2s3z-Medium CTDE 下, 原 MADiff 与 Agent-Aware 的对照实验.
# 来源: ctde_medium_history.yaml; 保留该地图和数据质量的历史窗口, 回报尺度及其他算法参数.
# 修改: mad_smac_aware, legacy/agent_aware, seed=100/200/300, all/film/时间编码开启/FFN关闭.
# 预算: 1M steps; 每 100k 保存并评估 10 回合, DDIM 15 步, 5 个环境, eval_model_seed=0.
# 输出: logs/mad_smac_aware/; 自动检测 checkpoint 并续训.
meta_data:
  exp_name: "mad_smac_aware"
  script_path: "run_scripts/train.py"
  num_workers: 3
  job_name: "{dataset}/h_{horizon}-hh_{history_horizon}-{model}-{attn_type}-{attn_levels}-{attn_cond_mode}-pe_{attn_use_time_enc}-ffn_{attn_use_ffn}-r_{returns_scale}-guidew_{condition_guidance_w}-ctde_{decentralized_execution}"

variables:
  attn_type: ["legacy", "agent_aware"]
  seed: [100, 200, 300]

  horizon: [4]
  history_horizon: [20]
  returns_scale: [20]
  dataset: ["2s3z-Medium"]
  condition_guidance_w: [1.2]

constants:
  attn_heads: 4
  attn_cond_mode: "film"
  attn_use_time_enc: True
  attn_use_ffn: False
  attn_levels: "all"
  num_envs: 10
  eval_model_seed: 0
  use_tensorboard: True

  # misc
  env_type: "smac"
  n_agents: 5
  use_action: True
  discrete_action: True
  residual_attn: True
  decentralized_execution: True
  use_zero_padding: False
  pred_future_padding: True
  use_ddim_sample: True
  n_ddim_steps: 15

  # model
  model: "models.SharedConvAttentionDeconv"
  diffusion: "models.GaussianDiffusion"
  share_inv: True
  n_diffusion_steps: 200
  action_weight: 10
  loss_weights: null
  loss_discount: 1
  dim_mults: [1, 4, 8]
  returns_condition: True
  predict_epsilon: True
  calc_energy: False
  dim: 128
  hidden_dim: 256
  condition_dropout: 0.25
  condition_guidance_w: 1.2
  ar_inv: False
  train_only_inv: False
  clip_denoised: True
  test_ret: 1.0
  renderer: "utils.SMACRenderer"

  # dataset
  loader: "datasets.SequenceDataset"
  normalizer: "CDFNormalizer"
  max_n_episodes: 50000
  preprocess_fns: []
  use_padding: True
  discount: 0.99
  max_path_length: 120
  termination_penalty: 0.0

  # training
  n_steps_per_epoch: 10000
  loss_type: "l2"
  n_train_steps: 1000000
  batch_size: 32
  learning_rate: 0.0002
  gradient_accumulate_every: 2
  ema_decay: 0.995
  log_freq: 1000
  save_freq: 100000
  sample_freq: 10000
  n_saves: 5
  save_parallel: False
  n_reference: 3
  save_checkpoints: True

  # eval
  evaluator: "utils.MADEvaluator"
  num_eval: 10
  eval_freq: 100000

  # load checkpoint
  continue_training: True
