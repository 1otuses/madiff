meta_data:
  exp_name: "mad_smac"
  script_path: "run_scripts/train.py"
  num_workers: 1
  job_name: "{dataset}/h_{horizon}-hh_{history_horizon}-{model}-r_{returns_scale}-guidew_{condition_guidance_w}-ctde_{decentralized_execution}"

variables: # 组合搜索的可变参数
  seed: [100]

  horizon: [4]
  history_horizon: [20]
  # agent通过读取history_horizon步的历史轨迹来预测未来horizon步的动作
  returns_scale: [20]
  dataset: ["3m-Good"]
  condition_guidance_w: [1.2]
  # 1.0: 表示标准只条件预测
  # >1.0: 表示放大条件预测影响
  # 0.0: 表示只无条件预测

constants: # 实验变体共用固定参数
  # misc
  seed: 100
  env_type: "smac"
  n_agents: 3
  use_action: True # 数据集加载actions
  discrete_action: True # 离散动作
  residual_attn: True # 跨agent-attention时用残差
  decentralized_execution: True # 中心化执行
  use_zero_padding: False # 轨迹长度不足时,填充处理
  # True: 用0填充, False: 用边界重复填充
  pred_future_padding: True # 未来超出episode的padding部分计入loss
  use_ddim_sample: True
  n_ddim_steps: 15

  # model
  model: "models.SharedIndependentTemporalUnet"
  # no-attention,
  diffusion: "models.GaussianDiffusion"
  share_inv: True
  # use_inv_dyn: True # 使用逆动力学模型
  n_diffusion_steps: 200
  action_weight: 10 # 用于提高轨迹中第一个动作的loss权重
  # 在use_inv_dyn为True时不生效
  loss_weights: null
  loss_discount: 1 # 对horizon预测时的损失权重
  use_return_to_go: True # RTG条件,在线评估时,每执行一步动作后更新
  dim_mults: [1, 4, 8]
  returns_condition: True
  predict_epsilon: True
  calc_energy: False
  dim: 128
  hidden_dim: 256
  condition_dropout: 0.25 # %25无条件,%75有条件
  condition_guidance_w: 1.2
  train_only_inv: False # loss = 0.5 * (diffusion_loss + inv_dyn_loss)
  clip_denoised: True # 在基于returns引导时作用
  test_ret: 1.0
  renderer: "utils.SMACRenderer"

  # dataset
  loader: "datasets.SequenceDataset" # 数据集加载器
  # 采样固定trajectory windows长度数据集 x: [H, N, transition]
  normalizer: "CDFNormalizer"
  # 使用CDF归一化, 使obs每个维度分布均匀映射到[-1,1]之间
  max_n_episodes: 50000 # 通常全部加载
  preprocess_fns: []
  use_padding: True
  discount: 1.0
  max_path_length: 60 # episode最大长度
  termination_penalty: 0.0

  # 训练参数
  n_steps_per_epoch: 10000 # 细分每训练批次
  n_train_steps: 200000 # 总训练步数
  batch_size: 32
  learning_rate: 0.0002
  gradient_accumulate_every: 2
  ema_decay: 0.995
  log_freq: 1000
  save_freq: 10000 
  sample_freq: 0 # 训练过程中,定期trajectory渲染
  n_saves: 5
  save_parallel: False
  n_reference: 3 # 训练过程可视化,选择3条参考轨迹
  save_checkpoints: True
  use_tensorboard: True

  # 评估参数
  evaluator: "utils.MADEvaluator"
  num_envs: 10 # 同时创建{}个环境评估
  num_eval: 100 # 每次评估总共执行{}条episodes
  # 分{}次评估,执行{}条episodes
  eval_freq: 10000 # 评估频率

  # load checkpoint
  continue_training: True